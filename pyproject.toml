[project]
name = "biohackeu26-ga4gh-sdk-upgrade"
version = "0.1.0"
description = "Docs of the BioHackathon Europe 2026 project on the GA4GH SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
]
# Documentation (`mkdocs.yml`), built by Read the Docs (`.readthedocs.yaml`)
# and in CI
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
    "pymdown-extensions>=10,<13",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
