site_name: GA4GH SDK upgrade
site_description: >-
  BioHackathon Europe 2026 project: a CLI that sends tasks to proTES with an
  LS Login token
# Read the Docs serves each version under its own path. No URL is assumed here:
# the variable is set in its builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]
repo_url: https://github.com/elixir-cloud-aai/biohackeu26-ga4gh-sdk-upgrade
repo_name: elixir-cloud-aai/biohackeu26-ga4gh-sdk-upgrade
edit_uri: edit/dev/docs/

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
- Home: index.md
- Plan:
  - plan/index.md
  - Tiers and issues: plan/tiers.md
  - Acceptance test: plan/acceptance.md
  - Extensibility: plan/extensibility.md
- Setup:
  - Getting started: setup/getting-started.md
  - Test targets: setup/test-targets.md
- Event:
  - Session plan: event/session-plan.md
- Outcomes:
  - Open questions: outcomes/open-questions.md
  - Results: outcomes/results.md
- About:
  - about/index.md
  - Glossary: about/glossary.md
  - References: about/references.md
